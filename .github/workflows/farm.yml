name: 農場自動產文

on:
  schedule:
    - cron: "0 0,12 * * *"   # 每天台灣時間 08:00、20:00
  workflow_dispatch:
    inputs:
      count:
        description: "這次產幾篇"
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: farm
  cancel-in-progress: false

jobs:
  farm:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 產生文章
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generator.py --news -n ${{ inputs.count || '3' }}

      - name: 把新文章存回 repo
        run: |
          git config user.name "farm-bot"
          git config user.email "farm-bot@users.noreply.github.com"
          git add farm.db
          git commit -m "農場產文 $(date -u +%F_%H%M)" || echo "沒有新文章"
          git push

      - name: 匯出靜態網站
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
